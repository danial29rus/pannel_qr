# Install as /etc/nginx/sites-available/panel.workkit-studio.ru
# Certbot will add TLS directives after the HTTP host is reachable.
server {
    listen 80;
    listen [::]:80;
    server_name panel.workkit-studio.ru;

    client_max_body_size 1m;
    # Keep the frontend's relative /api/v1 URL same-origin and avoid browser CORS issues.
    location /api/ {
        proxy_pass http://127.0.0.1:18180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:15174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
